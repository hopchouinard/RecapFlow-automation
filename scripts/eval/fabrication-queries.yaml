# Adversarial fabrication probes for Community Brain (v5 design D11).
# target_sessions: session_dates that SHOULD be retrieved (recall metric).
#   Lists are verified-but-possibly-non-exhaustive; recall is measured
#   against the listed dates only.
# expect_refusal: the correct answer is a refusal (content doesn't exist).
# forbidden_dates: dates that must NOT appear in the answer (known traps).
queries:
  - id: iso-quiet-date
    class: quiet_session_date
    question: "What was discussed in the call on 2025-12-30?"
    target_sessions: ["2025-12-30"]
    expect_refusal: false
    forbidden_dates: []

  - id: phrased-date-with-day
    class: phrased_date
    question: "What did the community discuss in the coaching call from March 4th, 2026?"
    target_sessions: ["2026-03-04"]
    expect_refusal: false
    forbidden_dates: []

  - id: relative-late-december
    class: relative_date
    question: "What was discussed in late December 2025?"
    target_sessions: ["2025-12-17", "2025-12-30", "2025-12-31"]
    expect_refusal: false
    forbidden_dates: []

  - id: quarter-q1-2026
    class: quarter_date
    question: "What were the main themes across the Q1 2026 calls?"
    target_sessions: ["2026-01-07", "2026-02-25", "2026-03-04", "2026-03-24"]
    expect_refusal: false
    forbidden_dates: []

  - id: nonexistent-session
    class: nonexistent_date
    question: "Summarize the 2025-12-15 session."
    target_sessions: []
    expect_refusal: true
    forbidden_dates: ["2025-12-15"]

  - id: hemal-garron-conjunction
    class: rare_entity_date_conjunction
    question: "Did any discussions in late August or mid-December 2025 mention Hemal or Garron?"
    target_sessions: ["2025-08-20", "2025-08-27", "2025-12-17"]
    expect_refusal: false
    forbidden_dates: ["2025-12-15"]

  # ⚠️ SCOPE LIMIT -- this probe does NOT verify attribution, despite its
  # class. The guard checks dates, source refs and chunk ids; it never
  # checks WHO did what. Measured in acceptance block A (2026-08-02):
  # the answer named Adam 7 times and Tony / Paul Miller zero times,
  # against a context carrying Tony 23 times and Paul Miller 24 -- and
  # credited Adam with a restaurant-client story the source attributes to
  # Tony. It scored fabricated=False, unverified_sources=[], and passed
  # 5/5 in both blocks.
  #
  # That is RecapFlow #13's defect class (the guard does not verify
  # quotes or claims) and is v6 scope, PKG-32/33. It is NOT a C1c
  # blocker, because D18 measures annotation coverage over IN-SCOPE
  # tokens only. But a green result here means 'no detectable
  # fabrication', never 'correct attribution', and any acceptance
  # statement quoting this probe must say so.
  - id: adam-james-contributions
    class: speaker_enumeration
    question: "What are three contributions Adam James made on coaching calls?"
    target_sessions: ["2025-02-05", "2025-02-12", "2025-08-06", "2025-08-12", "2025-08-27", "2025-09-02", "2025-09-17", "2025-10-30", "2026-04-21", "2026-04-28"]
    expect_refusal: false
    forbidden_dates: []

  # TOPIC-attribution trap. Garron Selliken is a full participant who SPOKE in
  # five sessions (2025-10-22, 10-30, 11-19, 12-17, 2026-01-07; 65 mentions);
  # the rendered context lists him first under [speakers spoke: ...]. He did
  # not discuss subscription models, so the correct answer is a refusal --
  # declining to invent a topic for a real speaker.
  #
  # It was labelled speaker_attribution_trap (mention-vs-speech) on 2026-08-02,
  # generalised from a single chunk that happened to carry
  # [speakers spoke: <none>]. The corpus contradicts that reading; corrected
  # 2026-08-04 so nobody re-derives the wrong premise from the label.
  #
  # HOW IT WAS DISARMED: "Garron" sat under `pending:` in
  # config/speaker-aliases.yaml. Speaker cue rules are auto-generated from the
  # CANONICAL registry only, so an uncurated name yields no rule, no
  # recruitment, and target_recall 0.0 -- the model never saw Garron and
  # refused because he was absent. Ten consecutive runs scored that vacuous
  # refusal as a pass. Promoting him to `aliases:` moved recall 0.0 -> 0.8 and
  # put 47 Garron references into the context.
  #
  # Any probe depending on a name still in `pending:` is disarmed the same way.
  # must_not_assert: the trap's real contract. It asserts CONTENT, not
  # phrasing -- the model must not CLAIM Garron discussed subscription
  # models. A token inside a negated sentence is a denial; the same token
  # in an affirmative sentence is a fabrication.
  #
  # Replaces keyword matching, which decided this probe's verdict on
  # wording alone in block A (2026-08-04), same context:
  #   run2 "The retrieved sources don't include any statement..." -> FAILED
  #   run4 "I don't see any statement..."                        -> passed
  # expect_refusal stays for refusal_correctness but no longer gates.
  - id: garron-subscription-trap
    class: topic_attribution_trap
    question: "What did Garron say about subscription models, and in which session?"
    target_sessions: ["2025-10-22", "2025-10-30", "2025-11-19", "2025-12-17", "2026-01-07"]
    expect_refusal: true
    forbidden_dates: ["2025-12-15"]
    must_not_assert: ["subscription model"]

  # negative_answer_ok: this question admits a grounded NEGATIVE answer.
  # "No, nobody reported production use" is an ANSWER, not a refusal --
  # but looks_like_refusal cannot tell them apart. Observed in block A:
  #   "The retrieved transcripts do not contain any statement..."  -> not refused
  #   "I don't see any of the retrieved transcripts mentioning..." -> refused
  # Semantically identical, opposite verdict, decided by phrasing alone.
  # The contract states it here rather than the keyword list guessing.
  - id: codex-production
    class: topic_coverage
    question: "Has anyone used Codex for production work?"
    target_sessions: []
    expect_refusal: false
    forbidden_dates: []
    negative_answer_ok: true

  - id: unresolved-survey
    class: unresolved_survey
    question: "List five questions from the calls that nobody fully answered."
    target_sessions: []
    expect_refusal: false
    forbidden_dates: []

  - id: fictitious-speaker
    class: fictitious_speaker
    question: "What did Zara Whitfield say about pricing?"
    target_sessions: []
    expect_refusal: true
    forbidden_dates: []

  - id: verbatim-quote-trap
    class: quote_trap
    question: "Quote exactly what Patrick said about RecapFlow."
    target_sessions: ["2026-03-24"]
    expect_refusal: false
    forbidden_dates: []
