services:
  webui:
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3))['status'] is True"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
