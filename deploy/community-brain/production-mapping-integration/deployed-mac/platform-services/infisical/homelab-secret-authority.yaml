project: homelab
project_id: a508e594-7686-43a1-9b0f-cafa8b348ad4
recovery_project: homelab-recovery
recovery_project_id: 69b4a69f-e8f9-4a2f-a1f2-9293ff668f44

environments:
  - prod
  - bootstrap

recovery_environments:
  - prod

folders:
  - /operators/codex
  - /operators/hermes
  - /operators/hermes/agentops
  - /infrastructure/proxmox
  - /infrastructure/pbs
  - /infrastructure/nut
  - /network/unifi-cloud-gateway
  - /edge/traefik
  - /pki/stepca
  - /observability/prometheus
  - /observability/grafana
  - /observability/alertmanager
  - /observability/uptime
  - /automation/n8n
  - /platform/postgres
  - /platform/wikijs
  - /platform/uptime-kuma
  - /platform/authentik
  - /platform/infisical
  - /platform/loki
  - /platform/nats

recovery_folders:
  - /infrastructure/proxmox
  - /infrastructure/pbs
  - /network/unifi-cloud-gateway
  - /edge/traefik
  - /pki/stepca
  - /observability/prometheus
  - /observability/grafana
  - /automation/n8n
  - /platform/wikijs
  - /platform/uptime-kuma
  - /platform/infisical

canaries:
  - env: prod
    path: /operators/codex
    key: CANARY_READ_OK
    class: automation
    owner: codex
    target: infisical
    access_type: token
    rotation: manual
    source_of_truth: infisical
    consumed_by: validate-infisical-access.sh
  - env: bootstrap
    path: /operators/codex
    key: CANARY_BOOTSTRAP_READ_OK
    class: automation
    owner: codex
    target: infisical
    access_type: token
    rotation: manual
    source_of_truth: infisical
    consumed_by: validate-infisical-access.sh
  - project: homelab-recovery
    env: prod
    path: /platform/infisical
    key: CANARY_RECOVERY_DENY
    class: break-glass
    owner: patrick
    target: infisical
    access_type: break-glass
    rotation: manual
    source_of_truth: break-glass
    consumed_by: Patrick

initial_import:
  - env: prod
    path: /platform/postgres
    key: WIKIJS_DB_PASSWORD
    source: "303:/opt/platform-services/secrets/platform-docs.env:DB_PASS"
    class: runtime
    owner: service
    target: platform-docs
    access_type: db
    rotation: manual
    source_of_truth: infisical
    consumed_by: platform-docs-wikijs
  - env: prod
    path: /platform/postgres
    key: INFISICAL_DB_PASSWORD
    source: "302:/opt/platform-services/secrets/platform-secrets.env:POSTGRES_PASSWORD"
    class: runtime
    owner: service
    target: platform-secrets
    access_type: db
    rotation: manual
    source_of_truth: infisical
    consumed_by: platform-secrets-infisical
  - env: prod
    path: /platform/infisical
    key: ENCRYPTION_KEY
    source: "302:/opt/platform-services/secrets/platform-secrets.env:ENCRYPTION_KEY"
    class: runtime
    owner: service
    target: platform-secrets
    access_type: token
    rotation: manual
    source_of_truth: infisical
    consumed_by: platform-secrets-infisical
  - env: prod
    path: /platform/infisical
    key: JWT_SECRET
    source: "302:/opt/platform-services/secrets/platform-secrets.env:JWT_SECRET"
    class: runtime
    owner: service
    target: platform-secrets
    access_type: token
    rotation: manual
    source_of_truth: infisical
    consumed_by: platform-secrets-infisical
  - env: prod
    path: /platform/infisical
    key: AUTH_SECRET
    source: "302:/opt/platform-services/secrets/platform-secrets.env:AUTH_SECRET"
    class: runtime
    owner: service
    target: platform-secrets
    access_type: token
    rotation: manual
    source_of_truth: infisical
    consumed_by: platform-secrets-infisical
  - env: prod
    path: /platform/postgres
    key: AUTHENTIK_DB_PASSWORD
    source: "301:/opt/platform-services/secrets/platform-auth.env:AUTHENTIK_POSTGRESQL__PASSWORD"
    class: runtime
    owner: service
    target: platform-auth
    access_type: db
    rotation: manual
    source_of_truth: infisical
    consumed_by: platform-auth-server,platform-auth-worker
  - env: prod
    path: /platform/authentik
    key: AUTHENTIK_SECRET_KEY
    source: "301:/opt/platform-services/secrets/platform-auth.env:AUTHENTIK_SECRET_KEY"
    class: runtime
    owner: service
    target: platform-auth
    access_type: token
    rotation: manual
    source_of_truth: infisical
    consumed_by: platform-auth-server,platform-auth-worker

operator_credentials:
  - env: prod
    path: /infrastructure/proxmox
    keys:
      - PVE_API_URL
      - PVE_API_TOKEN_ID
      - PVE_API_TOKEN_SECRET
    class: automation
    owner: codex
    target: proxmox
    access_type: api
    rotation: manual
    source_of_truth: infisical
    consumed_by: validate-proxmox-api-access.sh
    notes: "Read-only Proxmox VE API token codex-operator@pve!homelab-ro with PVEAuditor at / and privsep enabled."
  - env: prod
    path: /infrastructure/pbs
    keys:
      - PBS_API_URL
      - PBS_API_TOKEN_ID
      - PBS_API_TOKEN_SECRET
    class: automation
    owner: codex
    target: pbs
    access_type: api
    rotation: manual
    source_of_truth: infisical
    consumed_by: validate-pbs-api-access.sh
    notes: "Read-only Proxmox Backup Server API token codex-operator@pbs!homelab-ro with DatastoreReader on /datastore/PBS1."
  - env: prod
    path: /infrastructure/nut
    keys:
      - PVE1_NUT_PVE2_PASSWORD
      - PVE1_NUT_PVE3_PASSWORD
      - PVE1_NUT_PI_PASSWORD
      - PVE1_NUT_MAC_PASSWORD
      - PVE1_NUT_EXPORTER_PASSWORD
      - PVE1_NUT_CLARA_PASSWORD
      - PBS_NUT_MAC_PASSWORD
      - PBS_NUT_EXPORTER_PASSWORD
      - PBS_NUT_CLARA_PASSWORD
    class: runtime
    owner: service
    target: nut
    access_type: password
    rotation: manual
    source_of_truth: infisical
    consumed_by: pve1-ups-pve-cluster,pbs-ups-pbs-office
    notes: "Unique privilege-free NUT identities. No account has SET, FSD, instant-command, or upsmon authority during network-read-only commissioning."
  - env: prod
    path: /network/unifi-cloud-gateway
    keys:
      - UNIFI_HOST
      - UNIFI_API_KEY
    class: automation
    owner: codex
    target: unifi-cloud-gateway
    access_type: api
    rotation: manual
    source_of_truth: infisical
    consumed_by: validate-unifi-api-access.sh
    notes: "Read-only UniFi Network Integration API key for Cloud Gateway Fiber. The key is entered directly into Infisical and never printed."
  - env: prod
    path: /observability/grafana
    keys:
      - GRAFANA_URL
      - GRAFANA_SERVICE_ACCOUNT_TOKEN
      - GRAFANA_OIDC_CLIENT_ID
      - GRAFANA_OIDC_CLIENT_SECRET
      - GRAFANA_OIDC_SIGNING_KEY_ID
    class: automation
    owner: codex
    target: grafana
    access_type: api
    rotation: manual
    source_of_truth: infisical
    consumed_by: validate-grafana-api-access.sh
    notes: "Read-only Grafana service account token plus Authentik OIDC client metadata for Grafana SSO. Secret values are entered or generated into Infisical and never printed."
  - env: prod
    path: /observability/prometheus
    keys:
      - PROMETHEUS_URL
    class: automation
    owner: codex
    target: prometheus
    access_type: api
    rotation: none
    source_of_truth: infisical
    consumed_by: validate-prometheus-api-access.sh
    notes: "Prometheus has no native service-account token in this deployment. Access is gated by the HTTPS route and network policy; Infisical stores the canonical URL metadata."
  - env: prod
    path: /observability/grafana
    keys:
      - GF_SECURITY_ADMIN_PASSWORD
      - GRAFANA_USERNAME
      - GRAFANA_PASSWORD
    class: runtime
    owner: service
    target: grafana
    access_type: admin-password
    rotation: manual
    source_of_truth: infisical
    consumed_by: render-monitoring-runtime-env.sh,render-homepage-runtime-env.sh
    notes: "Runtime Grafana credentials rendered into service env files. GF_SECURITY_ADMIN_PASSWORD is the Grafana container boot admin password (monitoring stack .env); the break-glass human-recovery copy lives in homelab-recovery. GRAFANA_USERNAME/GRAFANA_PASSWORD are the dedicated homepage-grafana server-admin user the Homepage Grafana widget basic-auths with (it reads /api/admin/stats, which only a server admin can). Generated/entered into Infisical and never printed."
  - env: prod
    path: /observability/prometheus
    keys:
      - HA_PROMETHEUS_TOKEN
    class: runtime
    owner: service
    target: prometheus
    access_type: bearer-token
    rotation: manual
    source_of_truth: infisical
    consumed_by: render-monitoring-runtime-env.sh
    notes: "Home Assistant long-lived bearer token the Prometheus scrape job uses to read HA's /api/prometheus endpoint. Rendered into the monitoring stack .env; never printed."
  - env: prod
    path: /observability/alertmanager
    keys:
      - DISCORD_WEBHOOK_URL_CRITICAL
      - DISCORD_WEBHOOK_URL_WARNING
    class: runtime
    owner: service
    target: alertmanager
    access_type: webhook
    rotation: manual
    source_of_truth: infisical
    consumed_by: render-monitoring-runtime-env.sh
    notes: "Discord incoming-webhook URLs for the Alertmanager critical and warning notification routes. Rendered into the monitoring stack .env; never printed."
  - env: prod
    path: /observability/uptime
    keys:
      - UPTIME_HEARTBEAT_TOKEN
    class: runtime
    owner: service
    target: uptime-kuma
    access_type: capability-url
    rotation: manual
    source_of_truth: infisical
    consumed_by: render-monitoring-runtime-env.sh
    notes: "uptime-kuma push token for the monitoring-stack dead-man's-switch heartbeat (capability URL). Rendered into the monitoring stack .env and consumed by the uptime-heartbeat sidecar; never printed."
  - env: prod
    path: /observability/uptime
    keys:
      - UPTIME_KUMA_API_KEY
    class: runtime
    owner: service
    target: prometheus
    access_type: api-key
    rotation: manual
    source_of_truth: infisical
    consumed_by: render-monitoring-runtime-env.sh
    notes: "uptime-kuma API key used by the Prometheus scrape job as the basic-auth password to read uptime-kuma's /metrics endpoint. Rendered into the monitoring stack .env; never printed."
  - env: prod
    path: /automation/n8n
    keys:
      - N8N_API_BASE_URL
      - N8N_API_KEY
    class: automation
    owner: codex
    target: n8n
    access_type: api
    rotation: manual
    source_of_truth: infisical
    consumed_by: validate-n8n-api-access.sh
    notes: "n8n public API key for workflow automation visibility. The key is entered directly into Infisical and never printed."
  - env: prod
    path: /pki/stepca
    keys:
      - STEP_CA_URL
      - STEP_CA_PROVISIONER_NAME
      - STEP_CA_PROVISIONER_PASSWORD
      - STEP_CA_ROOT_FINGERPRINT
      - STEP_CA_X509_DEFAULT_DURATION
      - STEP_CA_X509_MAX_DURATION
    class: automation
    owner: codex
    target: stepca
    access_type: provisioner
    rotation: manual
    source_of_truth: infisical
    consumed_by: validate-stepca-operator-access.sh
    notes: "Dedicated StepCA JWK provisioner for operator-issued short-lived X.509 certificates. This intentionally avoids importing the broad admin@patchoutech.lab provisioner password."
  - env: prod
    path: /edge/traefik
    keys:
      - TRAEFIK_API_URL
      - TRAEFIK_SSH_HOST
      - TRAEFIK_SSH_USER
      - TRAEFIK_SSH_PRIVATE_KEY_B64
      - TRAEFIK_CONFIG_ROOT
      - TRAEFIK_COMPOSE_PROJECT_DIR
      - TRAEFIK_COMPOSE_FILE
      - TRAEFIK_DYNAMIC_CONFIG_DIR
    class: automation
    owner: codex
    target: traefik
    access_type: ssh
    rotation: manual
    source_of_truth: infisical
    consumed_by: validate-traefik-operator-access.sh
    notes: "Dedicated SSH key for Traefik Pi operator workflows plus Traefik API/config path metadata. The API is read-only; config changes remain deterministic script-driven SSH operations."
  - env: prod
    path: /platform/authentik
    keys:
      - AUTHENTIK_API_URL
      - AUTHENTIK_API_TOKEN
    class: automation
    owner: codex
    target: authentik
    access_type: api
    rotation: manual
    source_of_truth: infisical
    consumed_by: validate-authentik-api-access.sh
    notes: "Dedicated Authentik operator API token. The token is entered directly into Infisical and never printed. Routine automation must not use akadmin."
  - env: prod
    path: /platform/wikijs
    keys:
      - WIKIJS_OIDC_CLIENT_ID
      - WIKIJS_OIDC_CLIENT_SECRET
      - WIKIJS_OIDC_ISSUER_URL
      - WIKIJS_OIDC_AUTHORIZATION_URL
      - WIKIJS_OIDC_TOKEN_URL
      - WIKIJS_OIDC_USERINFO_URL
      - WIKIJS_OIDC_LOGOUT_URL
    class: runtime
    owner: service
    target: platform-docs
    access_type: oidc
    rotation: manual
    source_of_truth: infisical
    consumed_by: configure-wikijs-oidc.sh
    notes: "Wiki.js OIDC client metadata for Authentik native SSO. The client secret is generated by automation, stored in Infisical, and never printed."
  - env: prod
    path: /platform/wikijs
    keys:
      - WIKIJS_GRAPHQL_URL
      - WIKIJS_DOCS_PUBLISHER_API_TOKEN
    class: automation
    owner: agent-ops
    target: platform-docs
    access_type: api
    rotation: manual
    source_of_truth: infisical
    consumed_by: patchoutech-infra-docs-to-wikijs publisher
    notes: "Dedicated Wiki.js API credential for copying approved Git-backed PatchouTech InfraDocs content into Wiki.js. The token is generated through Wiki.js, stored in Infisical, and never printed."
  - env: prod
    path: /platform/uptime-kuma
    keys:
      - UPTIME_KUMA_AUTHENTIK_APP_SLUG
      - UPTIME_KUMA_AUTHENTIK_PROVIDER_NAME
      - UPTIME_KUMA_AUTHENTIK_EXTERNAL_HOST
      - UPTIME_KUMA_AUTHENTIK_FORWARD_AUTH_URL
    class: runtime
    owner: service
    target: platform-uptime
    access_type: proxy-sso
    rotation: manual
    source_of_truth: infisical
    consumed_by: configure-traefik-uptime-authentik-proxy.sh
    notes: "Uptime Kuma Authentik proxy metadata for route-scoped Traefik forward-auth. Uptime Kuma internal login remains enabled."
  - env: prod
    path: /platform/uptime-kuma
    keys:
      - HERMES_EVENT_CANARY_PUSH_TOKEN
    class: runtime
    owner: agent-ops
    target: platform-uptime
    access_type: push-monitor-token
    rotation: manual
    source_of_truth: infisical
    consumed_by: configure-uptime-kuma-hermes-canary.sh
    notes: "Dedicated Uptime Kuma push token for the Hermes AgentOps event-flow canary. The token is generated by automation, stored in Infisical, injected into Uptime Kuma, and never printed."
  - env: prod
    path: /operators/hermes/agentops
    keys:
      - HERMES_WEBHOOK_SECRET_PLATFORM_CRITICAL
      - HERMES_WEBHOOK_SECRET_PLATFORM_INTAKE
      - HERMES_WEBHOOK_SECRET_PLATFORM_CHANGE
      - HERMES_WEBHOOK_SECRET_PLATFORM_SECURITY
      - HERMES_WEBHOOK_SECRET_PLATFORM_GATEWAY
    class: runtime
    owner: hermes
    target: agent-ops
    access_type: hmac-webhook
    rotation: manual
    source_of_truth: infisical
    consumed_by: render-hermes-agentops-runtime-secrets.sh
    notes: "Route-specific HMAC secrets for Agent Ops event bridge delivery into Hermes webhooks. Generated into Infisical and rendered to root/operator-owned runtime files on the Hermes VM."
  - env: prod
    path: /platform/nats
    keys:
      - NATS_PRODUCER_AGENT_OPS_TOKEN
    class: runtime
    owner: hermes
    target: agent-ops
    access_type: nats-publisher
    rotation: manual
    source_of_truth: infisical
    consumed_by: render-hermes-agentops-runtime-secrets.sh
    notes: "Existing agent-ops JetStream publisher credential. PKG-25 declares it here because it is now also rendered to a dedicated operator-owned mode-0600 file, /etc/patchoutech-agent-ops/nats-agentops-audit-mirror.password, read only by the audit-mirror tailer. No new secret was minted; the key and its publish grants are unchanged apart from the single aoe.agentops.audit_mirror.> subject."
  - env: prod
    path: /platform/nats
    keys:
      - NATS_CONSUMER_AGENT_OPS_MCP_READER_TOKEN
    class: runtime
    owner: hermes
    target: agent-ops
    access_type: nats-reader
    rotation: manual
    source_of_truth: infisical
    consumed_by: render-hermes-agentops-runtime-secrets.sh
    notes: "Dedicated least-privilege JetStream reader credential for the Hermes AgentOps MCP event-query runtime. Rendered only as an operator-readable password file; it has no ordinary event-publish permission and is never printed or embedded in Hermes config.yaml."

manual_gates:
  - project: homelab-recovery
    env: prod
    path: /platform/wikijs
    key: ADMIN_RECOVERY_LOGIN
    reason: Wiki.js admin password is not recoverable from its password hash.
  - project: homelab-recovery
    env: prod
    path: /platform/uptime-kuma
    key: ADMIN_RECOVERY_LOGIN
    reason: Uptime Kuma admin password is not recoverable from its password hash.
  - project: homelab-recovery
    env: prod
    path: /infrastructure/proxmox
    key: ADMIN_RECOVERY_LOGIN
    reason: Human break-glass credential must be entered directly by Patrick.
  - project: homelab-recovery
    env: prod
    path: /infrastructure/pbs
    key: ADMIN_RECOVERY_LOGIN
    reason: Human break-glass credential must be entered directly by Patrick.
  - project: homelab-recovery
    env: prod
    path: /network/unifi-cloud-gateway
    key: ADMIN_RECOVERY_LOGIN
    reason: Human break-glass credential must be entered directly by Patrick.
  - project: homelab-recovery
    env: prod
    path: /observability/grafana
    key: ADMIN_RECOVERY_LOGIN
    reason: Human break-glass credential must be entered directly by Patrick.
  - project: homelab-recovery
    env: prod
    path: /automation/n8n
    key: ADMIN_RECOVERY_LOGIN
    reason: Human break-glass credential must be entered directly by Patrick.
