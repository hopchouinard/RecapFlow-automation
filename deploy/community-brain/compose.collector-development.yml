name: cbm-collector-development
services:
  proxy:
    image: nginx@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    network_mode: host
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    volumes:
    - ./collector-development/nginx.conf:/etc/nginx/nginx.conf:ro
    - /etc/community-brain-development/collector-tls:/run/tls:ro
    entrypoint: [nginx]
    command: [-g, 'daemon off;']
