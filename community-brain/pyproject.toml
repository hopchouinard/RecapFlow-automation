[project]
name = "community-brain"
version = "0.5.0"
description = "Vectorized knowledge base from AI community coaching calls"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "tiktoken>=0.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "click>=8.1",
    "tqdm>=4.66",
    # Pinned to a single minor on purpose. LanceDB's on-disk FTS index layout
    # changed between 0.30 and 0.34: a 0.30.2 client enumerates ZERO indices on
    # a table where 0.34.0 enumerates bm25_text_idx (measured on the n8n VM,
    # 2026-08-02). With the previous open floor of >=0.15, the serving container
    # (built later, got 0.34.0) and the host venv (built earlier, got 0.30.2)
    # drifted apart while both satisfied the spec, and the older client turned a
    # healthy corpus into a 503 on every /query. Lift this bound deliberately,
    # and rebuild the container and every venv in the same change.
    "lancedb>=0.34,<0.35",
    "ollama>=0.4",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
markers = [
    "no_mock_api_key: skip auto-mocking OPENROUTER_API_KEY for a test",
]
