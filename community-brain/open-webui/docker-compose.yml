services:
  open-webui:
    image: ghcr.io/open-webui/open-webui@sha256:b8095f79a6a8ffad8f830bdacc9b5b0aef805689b31bca0b065cc2424d3cfaeb
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      # Must point at the inference workstation over LAN, NOT
      # host.docker.internal -- Ollama does not run on the container host.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://10.1.50.219:11434}
      - WEBUI_AUTH=true
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  open-webui-data:
